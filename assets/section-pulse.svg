<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" fill="none" role="img" aria-label="05 · GitHub Pulse">
<title>05 · GitHub Pulse</title>
<style>@font-face{font-family:SG;font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.sg7{font-family:SG,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;font-style:normal}.jb4{font-family:JB,'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-weight:400;font-style:normal}.jb7{font-family:JB,'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-weight:700;font-style:normal}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.9}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadein .8s ease both}

@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(680px);opacity:0}}
.dot{animation:run 4.5s cubic-bezier(.6,0,.4,1) infinite}
</style>
<defs><linearGradient id="t" x1="74" x2="280.05" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="ln" x1="280.05" x2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".55" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>
<text x="2" y="56" class="jb7" font-size="38" fill="none" stroke="url(#t)" stroke-width="1.3">05</text>
<text x="74.0" y="48.0" class="sg7" font-size="30" fill="url(#t)" >GitHub Pulse</text>
<text x="75.0" y="72.0" class="jb4" font-size="14" fill="#6e7781" >// live activity, refreshed every 12 hours</text>
<path d="M280 38H1000" stroke="url(#ln)" stroke-width="1.5"/>
<circle class="dot" cx="280" cy="38" r="3.5" fill="#0ea5e9"/>
<circle cx="280" cy="38" r="3" fill="#0ea5e9"/>
</svg>
